name: Propose Gradle Dependency Verification Metadata

on:
  workflow_run:
    workflows: ["Gradle Dependency Verification Bootstrap"]
    types: [completed]

permissions: {}

concurrency:
  group: propose-gradle-verification-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  propose:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - name: Checkout the exact verified Main revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download metadata from the successful bootstrap run
        uses: actions/download-artifact@v7
        with:
          name: rivo-gradle-verification-bootstrap
          path: .verification-bootstrap
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Validate checksum metadata and prepare strict CI
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          source = Path(".verification-bootstrap/verification-metadata.xml")
          if not source.is_file():
              raise SystemExit("Bootstrap metadata artifact is missing")
          root = ET.parse(source).getroot()
          ns = {"g": "https://schema.gradle.org/dependency-verification"}
          config = root.find("g:configuration", ns)
          components = root.find("g:components", ns)
          if config is None or components is None:
              raise SystemExit("Invalid Gradle verification metadata structure")
          if config.findtext("g:verify-signatures", namespaces=ns) != "false":
              raise SystemExit("Expected checksum-only verification metadata")
          artifacts = [a for c in components for a in c.findall("g:artifact", ns)]
          if not components or not artifacts:
              raise SystemExit("No dependency artifacts were captured")
          for artifact in artifacts:
              hashes = list(artifact)
              if len(hashes) != 1 or hashes[0].tag != "{https://schema.gradle.org/dependency-verification}sha256":
                  raise SystemExit(f"Unexpected verification entry: {artifact.attrib}")
              if not re.fullmatch(r"[0-9a-f]{64}", hashes[0].attrib.get("value", "")):
                  raise SystemExit(f"Invalid SHA-256 value: {artifact.attrib}")
          Path("gradle").mkdir(exist_ok=True)
          Path("gradle/verification-metadata.xml").write_bytes(source.read_bytes())

          ci = Path(".github/workflows/android-ci.yml")
          text = ci.read_text()
          text = text.replace(
              "gradle --no-daemon",
              "gradle --no-daemon --dependency-verification strict",
          )
          marker = "      - name: Assemble shipping Rivo Browser"
          gate = (
              "      - name: Require checked-in Gradle dependency verification metadata\n"
              "        run: test -s gradle/verification-metadata.xml\n"
          )
          if gate not in text:
              if marker not in text:
                  raise SystemExit("Android CI insertion point not found")
              text = text.replace(marker, gate + marker, 1)
          ci.write_text(text)

          Path("DEPENDENCY_VERIFICATION.md").write_text("""# Gradle Dependency Verification

## Policy
- Gradle dependency verification is enforced in strict mode by Android CI.
- The committed metadata records SHA-256 checksums for resolved dependency artifacts and metadata.
- Signature verification is intentionally disabled in this baseline; no unverified PGP keys are trusted.
- No missing-key exceptions or ignored dependency artifacts are added.

## Bootstrap and provenance
The metadata is generated by the read-only Gradle Dependency Verification Bootstrap workflow using the repository's configured Google Maven, Maven Central and Mozilla repositories. It resolves the shipping debug build, lint, JVM tests, Gecko policy tests, GeckoView/WebView benchmark builds and minified shipping release bundle, then repeats the same task set in strict mode.

The first checksum baseline is a trust-on-first-use record of the artifacts served by those configured repositories at bootstrap time. It is not an independent upstream signature attestation. Review every new or changed checksum when dependencies or repositories change. Keep Gradle lockfiles and OSV scanning enabled as separate controls.

## Updating the metadata
1. Update dependency declarations and lockfiles intentionally.
2. Run the Gradle Dependency Verification Bootstrap workflow on Main.
3. Review the generated metadata artifact and its component/artifact changes.
4. Merge the generated metadata PR only after the dependency changes and repository provenance are understood.
5. Confirm Android CI passes with strict verification enabled.

Do not add PGP keys, ignored keys, or verification exceptions without independently verifying the key fingerprint and documenting the exact reason.
""")
          print(f"Validated {len(list(components))} components and {len(artifacts)} SHA-256 artifact entries")
          PY

      - name: Create a reviewable metadata pull request
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          branch="security/gradle-verification-metadata-${HEAD_SHA:0:12}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add gradle/verification-metadata.xml .github/workflows/android-ci.yml DEPENDENCY_VERIFICATION.md
          if git diff --cached --quiet; then
            echo "No dependency verification changes to propose."
            exit 0
          fi
          git commit -m "security: enforce Gradle dependency verification"
          git push origin "$branch"
          existing="$(gh pr list --head "$branch" --state open --json number --jq 'length')"
          if [ "$existing" = "0" ]; then
            gh pr create \
              --base main \
              --head "$branch" \
              --title "security: enforce strict Gradle dependency verification" \
              --body "## Summary
          - Add the reviewed SHA-256 dependency verification metadata generated from a successful Main bootstrap run.
          - Enforce Gradle strict dependency verification across Android CI tasks.
          - Document bootstrap provenance, update procedure and the deliberate checksum-only policy.

          ## Review requirements
          - Inspect the dependency metadata diff and confirm it matches the expected lockfiles and configured repositories.
          - No PGP keys, ignored keys or verification exceptions are introduced.
          - The bootstrap task set passed strict verification before this PR was created.

          This PR is generated for review only and is never auto-merged."
          fi
