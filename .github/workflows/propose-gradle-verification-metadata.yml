name: Propose Gradle Dependency Verification Metadata

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.2 build-tools;37.0.0'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          cache-provider: basic

      - name: Generate dependency checksums
        run: |
          gradle --no-daemon --write-verification-metadata sha256 \
            :app:assembleDebug \
            :app:lintDebug \
            :app:testDebugUnitTest \
            :engine-gecko:testDebugUnitTest \
            :engine-benchmark:assembleGeckoDebug \
            :engine-benchmark:assembleWebviewDebug \
            -Privo.abiSplits=false \
            :engine-benchmark:bundleGeckoRelease \
            :engine-benchmark:bundleWebviewRelease \
            :app:bundleRelease

      - name: Validate strict dependency verification
        run: |
          gradle --no-daemon --dependency-verification strict \
            :app:assembleDebug \
            :app:lintDebug \
            :app:testDebugUnitTest \
            :engine-gecko:testDebugUnitTest \
            :engine-benchmark:assembleGeckoDebug \
            :engine-benchmark:assembleWebviewDebug \
            -Privo.abiSplits=false \
            :engine-benchmark:bundleGeckoRelease \
            :engine-benchmark:bundleWebviewRelease \
            :app:bundleRelease

      - name: Prepare strict Android CI and documentation
        shell: bash
        run: |
          set -euo pipefail
          test -s gradle/verification-metadata.xml
          python3 -c 'import xml.etree.ElementTree as E; r=E.parse("gradle/verification-metadata.xml").getroot(); n={"g":"https://schema.gradle.org/dependency-verification"}; c=r.find("g:components",n); assert c is not None and len(c)>0; assert r.findtext("g:configuration/g:verify-signatures",namespaces=n)=="false"'
          sed -i 's/gradle --no-daemon/gradle --no-daemon --dependency-verification strict/g' .github/workflows/android-ci.yml
          python3 - <<'PY'
          from pathlib import Path
          p=Path(".github/workflows/android-ci.yml")
          s=p.read_text()
          marker="      - name: Assemble shipping Rivo Browser"
          gate="      - name: Require checked-in Gradle dependency verification metadata\n        run: test -s gradle/verification-metadata.xml\n"
          if gate not in s:
              if marker not in s:
                  raise SystemExit("Android CI insertion point not found")
              s=s.replace(marker,gate+marker,1)
              p.write_text(s)
          PY
          cat > DEPENDENCY_VERIFICATION.md <<'EOF'
          # Gradle Dependency Verification

          ## Policy
          - Android CI runs Gradle in strict dependency-verification mode.
          - The committed metadata records SHA-256 checksums for resolved artifacts and metadata.
          - PGP signature verification is intentionally disabled in this baseline; no unverified keys are trusted.
          - No missing-key exceptions, ignored artifacts or verification exceptions are allowed.

          ## Bootstrap and provenance
          Metadata is generated using the repository's configured Google Maven, Maven Central and Mozilla repositories. The bootstrap resolves the shipping debug build, lint, JVM tests, Gecko policy tests, GeckoView/WebView benchmark builds and minified shipping release bundle, then repeats the task set in strict mode.

          The initial checksum set is a trust-on-first-use record of artifacts served by those configured repositories at bootstrap time. It is not independent upstream signature attestation. Review every new or changed checksum when dependencies or repositories change. Keep Gradle lockfiles, OSV scanning and the source SBOM enabled as separate controls.

          ## Updating metadata
          1. Update dependency declarations and lockfiles intentionally.
          2. Run the Gradle Dependency Verification Bootstrap workflow on Main.
          3. Review the generated metadata and component/artifact changes.
          4. Merge the metadata PR only after dependency changes and repository provenance are understood.
          5. Confirm Android CI passes with strict verification enabled.

          Do not add PGP keys, ignored keys or verification exceptions without independently verifying fingerprints and documenting the reason.
          EOF

      - name: Open review PR for dependency verification
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          branch="security/gradle-verification-metadata-${HEAD_SHA:0:12}"
          git switch -c "$branch"
          git add gradle/verification-metadata.xml .github/workflows/android-ci.yml DEPENDENCY_VERIFICATION.md
          if git diff --cached --quiet; then
            echo "No dependency verification changes to propose."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "security: enforce Gradle dependency verification"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "security: enforce strict Gradle dependency verification" \
            --body "Adds SHA-256 verification metadata, enforces strict verification in Android CI, and documents the checksum-only trust-on-first-use policy. Review the complete metadata diff before merging. No PGP keys or ignored-key exceptions are introduced. This PR is never auto-merged."
