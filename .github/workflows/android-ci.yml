name: Android CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.2 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          cache-provider: basic
      - name: Assemble shipping Rivo Browser
        run: gradle --no-daemon :app:assembleDebug
      - name: Run Android lint
        run: gradle --no-daemon :app:lintDebug
      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Run Gecko engine policy unit tests
        run: gradle --no-daemon :engine-gecko:testDebugUnitTest
      - name: Assemble engine benchmark debug APKs
        run: |
          gradle --no-daemon \
            :engine-benchmark:assembleGeckoDebug \
            :engine-benchmark:assembleWebviewDebug
      - name: Build engine benchmark release bundles without ABI splits
        run: |
          gradle --no-daemon -Privo.abiSplits=false \
            :engine-benchmark:bundleGeckoRelease \
            :engine-benchmark:bundleWebviewRelease
      - name: Build minified shipping release bundle
        run: gradle --no-daemon -Privo.abiSplits=false :app:bundleRelease
      - name: Verify native library and APK 16 KB alignment
        shell: bash
        run: |
          mapfile -t apks < <(find app/build/outputs/apk/debug engine-benchmark/build/outputs/apk -type f -name '*.apk' | sort)
          mapfile -t aabs < <(find app/build/outputs/bundle/release engine-benchmark/build/outputs/bundle -type f -name '*.aab' | sort)
          args=()
          for artifact in "${apks[@]}"; do args+=(--apk "$artifact"); done
          for artifact in "${aabs[@]}"; do args+=(--aab "$artifact"); done
          (( ${#apks[@]} > 0 ))
          (( ${#aabs[@]} > 0 ))
          python3 tools/verify_16kb_alignment.py "${args[@]}"
      - name: Report artifact sizes
        shell: bash
        run: |
          {
            echo '### APK artifact sizes'
            find app/build/outputs/apk/debug engine-benchmark/build/outputs/apk -type f -name '*.apk' -printf '%P %s bytes\n' | sort
            echo '### AAB artifact sizes'
            find app/build/outputs/bundle/release engine-benchmark/build/outputs/bundle -type f -name '*.aab' -printf '%P %s bytes\n' | sort
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload unsigned shipping release AAB (QA only)
        uses: actions/upload-artifact@v4
        with:
          name: rivo-browser-release-aab-unsigned
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
      - name: Upload GeckoView benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rivo-engine-benchmark-gecko
          path: |
            engine-benchmark/build/outputs/apk/gecko/debug/*.apk
            engine-benchmark/build/outputs/bundle/geckoRelease/*.aab
          if-no-files-found: error
          retention-days: 14
      - name: Upload WebView benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rivo-engine-benchmark-webview
          path: |
            engine-benchmark/build/outputs/apk/webview/debug/*.apk
            engine-benchmark/build/outputs/bundle/webviewRelease/*.aab
          if-no-files-found: error
          retention-days: 14
      - name: Upload ARM64 shipping debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rivo-browser-arm64-debug
          path: app/build/outputs/apk/debug/*arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload ARMv7 shipping debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rivo-browser-armv7-debug
          path: app/build/outputs/apk/debug/*armeabi-v7a*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Enable KVM for Android emulator
        if: runner.os == 'Linux'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          if [ -e /dev/kvm ]; then
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "::warning::/dev/kvm is unavailable; emulator may use software acceleration."
          fi
      - name: Run Android security instrumentation tests
        uses: ReactiveCircus/android-emulator-runner@v2
        timeout-minutes: 20
        with:
          api-level: 35
          target: default
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          emulator-boot-timeout: 600
          script: gradle --no-daemon -Privo.abiSplits=false :app:connectedDebugAndroidTest --stacktrace --info
