name: Android CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          cache-provider: basic
      - name: Assemble Rivo Browser MVP
        run: gradle --no-daemon :app:assembleDebug
      - name: Run Android lint
        run: gradle --no-daemon :app:lintDebug
      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Upload Phase 1 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rivo-browser-phase1-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
