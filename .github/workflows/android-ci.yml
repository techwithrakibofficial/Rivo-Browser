name: Android CI
on:
  push:
    branches: [main, worker/rivo-11-privacy-security]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.2 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          cache-provider: basic
      - name: Assemble Rivo Browser MVP
        run: gradle --no-daemon :app:assembleDebug
      - name: Run Android lint
        run: gradle --no-daemon :app:lintDebug
      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build minified release bundle
        run: gradle --no-daemon -Privo.abiSplits=false :app:bundleRelease
      - name: Report ABI APK sizes
        shell: bash
        run: |
          find app/build/outputs/apk/debug -maxdepth 2 -type f -name '*.apk' -printf '%P %s bytes\\n' | tee /tmp/rivo-apk-sizes.txt
          test -s /tmp/rivo-apk-sizes.txt
          cat /tmp/rivo-apk-sizes.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Report release bundle size
        shell: bash
        run: |
          find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -printf '%f %s bytes\\n' | tee /tmp/rivo-aab-sizes.txt
          cat /tmp/rivo-aab-sizes.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload unsigned release bundle (QA only)
        uses: actions/upload-artifact@v4
        with:
          name: rivo-browser-release-aab-unsigned
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
      - name: Upload ARM64 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rivo-browser-arm64-debug
          path: app/build/outputs/apk/debug/*arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload ARMv7 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rivo-browser-armv7-debug
          path: app/build/outputs/apk/debug/*armeabi-v7a*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Run Android security instrumentation tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: gradle --no-daemon -Privo.abiSplits=false :app:connectedDebugAndroidTest
