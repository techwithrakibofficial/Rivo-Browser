name: Source SBOM

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    name: Generate source SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Generate SPDX source SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: rivo-source-sbom.spdx.json
          artifact-name: rivo-source-sbom
          upload-artifact: true
          upload-artifact-retention: 14
          syft-version: v1.55.0
        env:
          SYFT_SOURCE_NAME: Rivo Browser
          SYFT_SOURCE_VERSION: ${{ github.sha }}
