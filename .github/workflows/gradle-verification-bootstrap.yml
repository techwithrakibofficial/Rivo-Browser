name: Gradle Dependency Verification Bootstrap

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gradle-verification-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: Generate and validate verification metadata
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.2 build-tools;37.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          cache-provider: basic

      - name: Bootstrap PGP keys and SHA-256 checksums
        run: gradle --no-daemon --write-verification-metadata pgp,sha256 --export-keys help

      - name: Validate generated metadata in strict mode
        run: gradle --no-daemon --dependency-verification strict help

      - name: Upload generated verification files for review
        uses: actions/upload-artifact@v7
        with:
          name: rivo-gradle-verification-bootstrap
          path: |
            gradle/verification-metadata.xml
            gradle/verification-keyring.keys
          if-no-files-found: error
          retention-days: 7
