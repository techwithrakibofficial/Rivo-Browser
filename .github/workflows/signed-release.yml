name: Signed Android Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build (for example v0.2.0-rc.1)"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: rivo-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-sign:
    name: Build and verify signed APK/AAB
    if: github.actor == github.repository_owner
    environment: production
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release-ref.outputs.release_tag }}
    steps:
      - name: Validate release tag
        id: release-ref
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            release_tag="$INPUT_TAG"
          else
            release_tag="$REF_NAME"
          fi
          [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || {
            echo "::error::Invalid release tag format"; exit 1;
          }
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release commit is contained in main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD FETCH_HEAD || {
            echo "::error::Refusing to sign a commit that is not reachable from main."; exit 1;
          }

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: "platform-tools platforms;android-37.2 build-tools;37.0.0"

      - name: Configure and validate production signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.RIVO_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RIVO_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RIVO_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RIVO_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required production signing secret $name is not configured"; exit 1
            fi
          done

          KEYSTORE_PATH="$RUNNER_TEMP/rivo-upload.p12"
          # Termux/base64 output may be wrapped across lines or use the URL-safe
          # alphabet. Normalize whitespace/alphabet and validate without logging
          # any signing material; never silently discard invalid characters.
          export KEYSTORE_BASE64
          python3 - <<'PY'
          import base64
          import os
          import re
          import sys

          encoded = "".join(os.environ["KEYSTORE_BASE64"].split())
          encoded = encoded.translate(str.maketrans("-_", "+/"))
          if not re.fullmatch(r"[A-Za-z0-9+/]*={0,2}", encoded):
              sys.exit("::error::Keystore secret contains non-Base64 characters; restore the exact complete Base64 export.")
          encoded += "=" * (-len(encoded) % 4)
          try:
              decoded = base64.b64decode(encoded, validate=True)
          except Exception:
              sys.exit("::error::Keystore secret is truncated or invalid Base64; restore the exact complete Base64 export.")
          if not decoded:
              sys.exit("::error::Decoded keystore is empty.")
          with open(os.environ["RUNNER_TEMP"] + "/rivo-upload.p12", "wb") as keystore:
              keystore.write(decoded)
          PY
          test -s "$KEYSTORE_PATH"
          keytool -list -storetype PKCS12 -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

          {
            echo "RIVO_UPLOAD_STORE_FILE=$KEYSTORE_PATH"
            echo "RIVO_UPLOAD_STORE_PASSWORD=$STORE_PASSWORD"
            echo "RIVO_UPLOAD_KEY_ALIAS=$KEY_ALIAS"
            echo "RIVO_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "9.6.0"
          cache-provider: basic

      - name: Build signed, minified APK splits
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace -Privo.releaseSigningRequired=true \
            -Privo.abiSplits=true clean :app:assembleRelease
          mkdir -p dist
          mapfile -t apks < <(find app/build/outputs/apk/release -type f -name '*.apk' | sort)
          (( ${#apks[@]} >= 1 )) || { echo "::error::No release APKs were produced."; exit 1; }
          cp "${apks[@]}" dist/

      - name: Build signed, minified universal AAB
        run: |
          set -euo pipefail
          # AGP cannot bundle an app while multiple ABI APK splits are enabled.
          # Preserve APKs in dist, clean intermediates, then build the single AAB
          # with ABI splits disabled for this separate Gradle invocation.
          gradle --no-daemon --stacktrace clean
          gradle --no-daemon --stacktrace -Privo.releaseSigningRequired=true \
            -Privo.abiSplits=false :app:bundleRelease
          mapfile -t aabs < <(find app/build/outputs/bundle/release -type f -name '*.aab' | sort)
          (( ${#aabs[@]} == 1 )) || { echo "::error::Expected exactly one release AAB."; exit 1; }
          cp "${aabs[0]}" dist/

      - name: Verify R8 output, signatures, and signer identity
        shell: bash
        run: |
          set -euo pipefail
          # APK outputs were copied to dist/ before the clean required for
          # the separate AAB build. Verify those preserved files, not the
          # app/build APK directory that the clean task intentionally deletes.
          AAB_DIR="app/build/outputs/bundle/release"
          MAPPING_FILE="app/build/outputs/mapping/release/mapping.txt"
          APKSIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"

          test -s "$MAPPING_FILE" || {
            echo "::error::R8 mapping output is missing; release minification was not verified."; exit 1;
          }
          test -x "$APKSIGNER" || {
            echo "::error::Android apksigner executable is missing."; exit 1;
          }

          mkdir -p dist
          mapfile -t apks < <(find dist -maxdepth 1 -type f -name '*.apk' | sort)
          mapfile -t aabs < <(find "$AAB_DIR" -type f -name '*.aab' | sort)
          (( ${#apks[@]} >= 1 )) || { echo "::error::No release APKs were produced."; exit 1; }
          (( ${#aabs[@]} == 1 )) || { echo "::error::Expected exactly one release AAB."; exit 1; }

          expected_cert=""
          for apk in "${apks[@]}"; do
            signature_output="$("$APKSIGNER" verify --verbose --print-certs "$apk" 2>&1)"
            printf '%s\n' "$signature_output"
            apk_cert="$(printf '%s\n' "$signature_output" | sed -nE 's/.*certificate SHA-256 digest: ([0-9A-Fa-f:]+).*/\1/p' | head -n1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
            test -n "$apk_cert" || { echo "::error::Could not read APK signer certificate fingerprint."; exit 1; }
            if [[ -z "$expected_cert" ]]; then
              expected_cert="$apk_cert"
            elif [[ "$apk_cert" != "$expected_cert" ]]; then
              echo "::error::Release APKs were signed by different certificates."; exit 1
            fi
          done

          aab="${aabs[0]}"
          aab_verify_output="$(jarsigner -verify -verbose "$aab" 2>&1)"
          printf '%s\n' "$aab_verify_output"
          grep -Fq 'jar verified.' <<< "$aab_verify_output" || {
            echo "::error::AAB signature verification did not confirm a signed, verified bundle."; exit 1;
          }
          aab_cert="$(keytool -printcert -jarfile "$aab" | sed -nE 's/^[[:space:]]*SHA256:[[:space:]]*([0-9A-Fa-f:]+).*/\1/p' | head -n1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test -n "$aab_cert" || { echo "::error::Could not read AAB signer certificate fingerprint."; exit 1; }
          [[ "$aab_cert" == "$expected_cert" ]] || {
            echo "::error::APK and AAB signing certificates do not match."; exit 1;
          }
          cp "$aab" dist/

          cd dist
          sha256sum * > SHA256SUMS
          ls -lh

      - name: Retain R8 mapping file for release diagnostics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rivo-r8-mapping-${{ github.run_id }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 90

      - name: Remove temporary signing keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/rivo-upload.p12"

      - name: Upload verified release assets for publishing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rivo-signed-release-${{ github.run_id }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish verified GitHub Release
    needs: build-and-sign
    if: github.actor == github.repository_owner
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: rivo-signed-release-${{ github.run_id }}
          path: dist

      - name: Publish signed GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build-and-sign.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RELEASE_TAG"
          test -s dist/SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS)

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists; refusing to overwrite or mutate published release assets."
            exit 1
          fi

          gh release create "$RELEASE_TAG" dist/* \
            --verify-tag \
            --title "Rivo Browser $RELEASE_TAG" \
            --generate-notes

          verify_dir="$(mktemp -d)"
          trap 'rm -rf "$verify_dir"' EXIT
          gh release download "$RELEASE_TAG" --dir "$verify_dir"
          test -s "$verify_dir/SHA256SUMS"
          (cd "$verify_dir" && sha256sum -c SHA256SUMS)
