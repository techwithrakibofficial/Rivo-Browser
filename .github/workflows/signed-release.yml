name: Signed Android Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build (for example v0.2.0-rc.1)"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: rivo-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-sign:
    name: Build and verify signed APK/AAB
    if: github.actor == github.repository_owner
    environment: production
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release-ref.outputs.release_tag }}
    steps:
      - name: Validate release tag
        id: release-ref
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            release_tag="$INPUT_TAG"
          else
            release_tag="$REF_NAME"
          fi
          [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || {
            echo "::error::Invalid release tag format"; exit 1;
          }
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release commit is contained in main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD FETCH_HEAD || {
            echo "::error::Refusing to sign a commit that is not reachable from main."; exit 1;
          }

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37.2 build-tools;37.0.0"

      - name: Configure production signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.RIVO_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RIVO_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RIVO_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RIVO_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required production signing secret $name is not configured"; exit 1
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/rivo-upload.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "RIVO_UPLOAD_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "RIVO_UPLOAD_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "RIVO_UPLOAD_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "RIVO_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "RIVO_UPLOAD_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
          cache-provider: basic

      - name: Build signed APKs and AAB
        run: |
          gradle --no-daemon -Privo.releaseSigningRequired=true \
            :app:assembleRelease :app:bundleRelease

      - name: Verify signatures and prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t apks < <(find app/build/outputs/apk/release -type f -name '*.apk' | sort)
          mapfile -t aabs < <(find app/build/outputs/bundle/release -type f -name '*.aab' | sort)
          (( ${#apks[@]} >= 1 ))
          (( ${#aabs[@]} >= 1 ))
          for apk in "${apks[@]}"; do
            apksigner verify --verbose --print-certs "$apk"
            cp "$apk" dist/
          done
          for aab in "${aabs[@]}"; do
            jarsigner -verify -strict -certs "$aab"
            cp "$aab" dist/
          done
          cd dist
          sha256sum * > SHA256SUMS
          ls -lh

      - name: Remove temporary signing keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/rivo-upload.jks"

      - name: Upload verified release assets for publishing
        uses: actions/upload-artifact@v4
        with:
          name: rivo-signed-release-${{ github.run_id }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish verified GitHub Release
    needs: build-and-sign
    if: github.actor == github.repository_owner
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@v4
        with:
          name: rivo-signed-release-${{ github.run_id }}
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build-and-sign.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RELEASE_TAG"
          test -s dist/SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS)
          gh release create "$RELEASE_TAG" dist/* \
            --verify-tag \
            --title "Rivo Browser $RELEASE_TAG" \
            --generate-notes
