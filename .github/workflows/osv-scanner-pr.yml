name: OSV Scanner PR

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  scan-resolved-gradle-dependencies:
    name: Resolve and scan Gradle lockfiles
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # PR-controlled Gradle build logic is untrusted: never grant it repository write access.
    permissions:
      contents: read
    steps:
      - name: Checkout PR branch without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-37.2 build-tools;37.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '9.6.0'
          cache-provider: basic
      - name: Resolve every Android module and write exact dependency locks
        run: >-
          gradle --no-daemon --write-locks
          :app:dependencies
          :engine-api:dependencies
          :engine-webview:dependencies
          :engine-gecko:dependencies
          :engine-benchmark:dependencies
      - name: Verify resolved lockfiles are present and non-empty
        shell: bash
        run: |
          mapfile -t lockfiles < <(find . -type f -name gradle.lockfile -not -path './.gradle/*' | sort)
          (( ${#lockfiles[@]} >= 3 ))
          for lockfile in "${lockfiles[@]}"; do
            grep -Eq '^[^#[:space:]][^=]*=[^[:space:]]' "$lockfile"
          done
          printf 'Resolved Gradle lockfiles:\n%s\n' "${lockfiles[@]}"
      # Scan actual Gradle dependency lockfiles, not the checksum catalog.
      - name: Scan resolved Gradle dependencies with OSV
        uses: google/osv-scanner-action/osv-scanner-action@0e457b42d0120153c352875e9b758b1e5c58c7e5
        with:
          scan-args: |
            --lockfile=./app/gradle.lockfile
            --lockfile=./engine-api/gradle.lockfile
            --lockfile=./engine-webview/gradle.lockfile
            --lockfile=./engine-gecko/gradle.lockfile
            --lockfile=./engine-benchmark/gradle.lockfile
      - name: Verify dependency lockfiles are committed
        shell: bash
        run: |
          if ! git diff --quiet -- ':(glob)**/gradle.lockfile'; then
            echo "::error::Gradle dependency lockfiles changed during resolution."
            echo "Review the uploaded rivo-gradle-lockfiles artifact and commit the updated lockfiles in the pull request."
            git diff --stat -- ':(glob)**/gradle.lockfile'
            exit 1
          fi
          echo "All resolved Gradle lockfiles match the committed PR source."
      - name: Upload resolved Gradle lockfiles
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rivo-gradle-lockfiles
          path: |
            **/gradle.lockfile
          if-no-files-found: error
          retention-days: 14
