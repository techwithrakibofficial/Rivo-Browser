name: OSV Scanner PR

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan-pr:
    name: Scan introduced dependency vulnerabilities
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.7.0
    permissions:
      actions: read
      contents: read
      security-events: write

  scan-resolved-gradle-dependencies:
    name: Resolve and scan Gradle lockfiles
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # PR-controlled Gradle build logic is untrusted: never grant it repository write access.
    permissions:
      contents: read
    steps:
      - name: Checkout PR branch without persisting credentials
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.2 build-tools;37.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          cache-provider: basic
      - name: Resolve every Android module and write exact dependency locks
        run: >-
          gradle --no-daemon --write-locks
          :app:dependencies
          :engine-api:dependencies
          :engine-webview:dependencies
          :engine-gecko:dependencies
          :engine-benchmark:dependencies
      - name: Verify resolved lockfiles are present and non-empty
        shell: bash
        run: |
          mapfile -t lockfiles < <(find . -type f -name gradle.lockfile -not -path './.gradle/*' | sort)
          (( ${#lockfiles[@]} >= 3 ))
          for lockfile in "${lockfiles[@]}"; do
            grep -Eq '^[^#[:space:]][^=]*=[^[:space:]]' "$lockfile"
          done
          printf 'Resolved Gradle lockfiles:\\n%s\\n' "${lockfiles[@]}"
      - name: Scan resolved Gradle dependencies with OSV
        uses: google/osv-scanner-action/osv-scanner-action@0a65f82af05cd58cf587827b0bb0489548c18346
        with:
          scan-args: |
            --recursive
            ./
      - name: Verify dependency lockfiles are committed
        shell: bash
        run: |
          if ! git diff --quiet -- ':(glob)**/gradle.lockfile'; then
            echo "::error::Gradle dependency lockfiles changed during resolution."
            echo "Review the uploaded rivo-gradle-lockfiles artifact and commit the updated lockfiles in the pull request."
            git diff --stat -- ':(glob)**/gradle.lockfile'
            exit 1
          fi
          echo "All resolved Gradle lockfiles match the committed PR source."
      - name: Upload resolved Gradle lockfiles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rivo-gradle-lockfiles
          path: |
            **/gradle.lockfile
          if-no-files-found: error
          retention-days: 14
