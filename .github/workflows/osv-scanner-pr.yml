name: OSV Scanner PR

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan-pr:
    name: Scan introduced dependency vulnerabilities
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.7.0
    permissions:
      actions: read
      contents: read
      security-events: write


  scan-resolved-gradle-dependencies:
    name: Resolve and scan Gradle lockfiles
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'worker/account-b-security-qa-2026-11-09' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          persist-credentials: true
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.2 build-tools;37.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          cache-provider: basic
      - name: Resolve every Android module and write exact dependency locks
        run: >-
          gradle --no-daemon --write-locks
          :app:dependencies
          :engine-api:dependencies
          :engine-webview:dependencies
          :engine-gecko:dependencies
          :engine-benchmark:dependencies
      - name: Verify resolved lockfiles are present and non-empty
        shell: bash
        run: |
          mapfile -t lockfiles < <(find . -type f -name gradle.lockfile -not -path './.gradle/*' | sort)
          (( ${#lockfiles[@]} >= 3 ))
          for lockfile in "${lockfiles[@]}"; do
            grep -Eq '^[^#[:space:]][^=]*=[^[:space:]]' "$lockfile"
          done
          printf 'Resolved Gradle lockfiles:\n%s\n' "${lockfiles[@]}"
      - name: Scan resolved Gradle dependencies with OSV
        uses: google/osv-scanner-action/osv-scanner-action@0a65f82af05cd58cf587827b0bb0489548c18346
        with:
          scan-args: |
            --recursive
            ./
      - name: Upload resolved Gradle lockfiles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rivo-gradle-lockfiles
          path: |
            **/gradle.lockfile
          if-no-files-found: error
          retention-days: 14
      - name: Commit generated dependency locks to the PR branch
        if: always()
        shell: bash
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          mapfile -t lockfiles < <(find . -type f -name gradle.lockfile -not -path './.gradle/*' | sort)
          if (( ${#lockfiles[@]} == 0 )); then
            echo 'No generated Gradle lockfiles to commit.'
            exit 0
          fi
          git fetch origin "${PR_BRANCH}"
          git reset --mixed "origin/${PR_BRANCH}"
          git add "${lockfiles[@]}"
          if git diff --cached --quiet; then
            echo 'Gradle lockfiles are already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(deps): lock resolved Gradle dependencies'
          git push origin "HEAD:${PR_BRANCH}"
